<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | BEEN ASHEER SMART DATA</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f0f5f8;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  background: white;
  width: 100%;
  max-width: 430px;
  padding: 30px 25px;
  border-radius: 20px;
  box-shadow: 0 5px 25px #00000012;
}

h1 {
  color: #102c47;
  text-align: center;
  font-size: 23px;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #788895;
  margin-bottom: 25px;
  font-size: 14px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
  font-size: 14px;
  color: #142c43;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #dce3e8;
  border-radius: 10px;
  margin-bottom: 18px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 15px;
  background: #07815d;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

.register {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
}

.register a {
  color: #07815d;
  font-weight: bold;
  text-decoration: none;
}

footer {
  text-align: center;
  margin-top: 25px;
  font-size: 12px;
  color: #8795a1;
}
</style>
</head>

<body>

<div class="container">

<h1>BEEN ASHEER SMART DATA</h1>

<p class="subtitle">Welcome Back! Please Login</p>

<form id="loginForm">

<label>Email Address</label>

placeholder="Enter your email" required>

<label>Password</label>
<input type="password" id="password"
placeholder="Enter your password" required>

<button type="submit">Login</button>

</form>

<div class="register">
Don't have an account?
<a href="register.html">Create Account</a>
</div>

<footer>
BEEN ASHEER SMART DATA © 2026<br>
Fast • Reliable • Secure
</footer>

</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(e) {
  e.preventDefault();

  alert("Login system will be activated after backend integration.");
});
</script>

</body>
</html>
