<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | BEEN ASHEER SMART DATA</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f0f5f8;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  background: white;
  width: 100%;
  max-width: 430px;
  padding: 30px 25px;
  border-radius: 20px;
  box-shadow: 0 5px 25px #00000012;
}

h1 {
  color: #102c47;
  text-align: center;
  font-size: 23px;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #788895;
  margin-bottom: 25px;
  font-size: 14px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
  font-size: 14px;
  color: #142c43;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #dce3e8;
  border-radius: 10px;
  margin-bottom: 18px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #07815d;
}

button {
  width: 100%;
  padding: 15px;
  background: #07815d;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.login {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
}

.login a {
  color: #07815d;
  font-weight: bold;
  text-decoration: none;
}

footer {
  text-align: center;
  margin-top: 25px;
  font-size: 12px;
  color: #8795a1;
}
</style>
</head>

<body>

<div class="container">

<h1>BEEN ASHEER SMART DATA</h1>

<p class="subtitle">Create Your Account</p>

<form id="registerForm">

<label>Full Name</label>
<input type="text" id="name"
placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" id="email"
placeholder="Enter your email" required>

<label>Phone Number</label>
<input type="tel" id="phone"
placeholder="Enter your phone number" required>

<label>Password</label>
<input type="password" id="password"
placeholder="Create a password" minlength="8" required>

<label>Confirm Password</label>
<input type="password" id="confirmPassword"
placeholder="Confirm your password" required>

<button type="submit">Create Account</button>

</form>

<div class="login">
Already have an account?
<a href="login.html">Login</a>
</div>

<footer>
BEEN ASHEER SMART DATA © 2026<br>
Fast • Reliable • Secure
</footer>

</div>

<script>
document.getElementById("registerForm")
.addEventListener("submit", function(e) {

  e.preventDefault();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    alert("Passwords do not match!");
    return;
  }

  alert("Registration interface completed! Account creation will be enabled after secure backend integration.");

});
</script>

</body>
</html>
